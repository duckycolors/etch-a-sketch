<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etch-A-Sketch</title>
    <link rel="stylesheet" href="styles.css"> 
</head>
<body>
    <select id ="colourselect">
        <option>Choose a colour</option>
        <option>Red</option>
        <option>Orange</option>
        <option>Yellow</option>
        <option>Green</option>
        <option>Lime</option>
        <option>LightBlue</option>
        <option>Blue</option>
        <option>Magenta</option>
        <option>Pink</option>
        <option>DeepPink</option>
    </select>

    <div id="bigbigContainer">
        <h1>Etch-A-Sketch</h1>
        <label id="gridNumberLabel">Grid Number:</label>
        <input id="gridNumber" type="range" min="1" max="100"><br>
        <button id="btn">Load Grid</button>
    </div>

    <div id="containertop">
        <button id="colourbutton"></button>
    </div>

    <div id="container"></div>
    <script src="script.js"></script>
</body>
</html>
